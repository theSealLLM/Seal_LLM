[project]
name = "theSeal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.7,<3",
  "transformers>=4.51,<5",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.6,<2",
  "numpy>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "langchain-core>=0.3.60,<2",
  "openai>=2,<3",
  "huggingface-hub>=0.30,<1",
  # NeoBERT(chandar-lab/NeoBERT)의 저장소 코드가 xformers.ops.SwiGLU를 import 한다.
  # transformers가 remote code를 실행하기 전에 import 구문을 검사하므로 없으면 로딩 자체가 막힌다.
  # 맥(darwin)용 휠이 없어 torch와 같은 방식으로 플랫폼을 나눈다 (맥에서는 NeoBERT를 못 쓴다).
  "xformers>=0.0.35,<1 ; sys_platform == 'win32' or sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false
# OneDrive 동기화 폴더에서는 하드링크를 못 써서(os error 396) 복사 모드로 고정
link-mode = "copy"
# lock 파일을 만들 때 고려할 플랫폼 (Apple Silicon 맥 / 윈도우 / 리눅스)
# Intel 맥은 torch 2.7+ 빌드가 없어서 제외
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32'",
  "sys_platform == 'linux'",
]

# torch 설치 위치를 OS별로 분기
# - 맥: PyPI 기본 빌드 (Apple Silicon GPU = MPS)
# - 윈도우/리눅스: PyTorch 공식 CUDA 12.8 빌드
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests/test_lesson_training.py", "tests/test_lesson_service.py"]
pythonpath = ["steps"]

[tool.ruff]
line-length = 100
target-version = "py312"
